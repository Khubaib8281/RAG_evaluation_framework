name: RAG system CI

on:
  push:
    branch: [main]
  pull_requests:
    branch : [main]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/checkout@v4

        with:
          python-version: 3.10

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # - name: Run Evaluation
      #   run: |
      #     python evaluation/evaluate.py